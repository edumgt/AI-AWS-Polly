name: Deploy frontend to S3 (mirror)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: polly-bucket-edumgt
  BUILD_DIR: frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::086015456585:role/github-actions-ai-aws-polly-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      # ✅ 백엔드 Lambda 배포 스크립트 실행 (추가)
      - name: Deploy backend Lambda (aws-cli script)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x infra/aws-cli-deploy-lambda.sh
          AWS_REGION="${{ env.AWS_REGION }}" \
          S3_BUCKET="${{ env.S3_BUCKET }}" \
          ./infra/aws-cli-deploy-lambda.sh

      - name: Sync assets to S3 (mirror)
        run: |
          aws s3 sync "${{ env.BUILD_DIR }}/" "s3://${{ env.S3_BUCKET }}/frontend/" \
            --delete \
            --only-show-errors
